<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kavach Search — Embed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #ffffff;
    --surface:     #f8f9fc;
    --surface-2:   #f1f5f9;
    --border:      #e2e8f0;
    --text:        #333333;
    --text-muted:  #64748b;
    --text-dim:    #94a3b8;
    --accent:      #26AAFF;
    --accent-hover:#536DFF;
    --accent-bg:   rgba(38,170,255,0.12);
    --red:         #ef4444;
    --red-bg:      rgba(239,68,68,0.10);
    --red-border:  rgba(239,68,68,0.30);
    --blue-bg:     rgba(38,170,255,0.10);
    --blue-border: rgba(38,170,255,0.25);
    --blue-text:   #26AAFF;
    --amber-bg:    rgba(245,158,11,0.10);
    --amber-border:rgba(245,158,11,0.25);
    --amber-text:  #d97706;
    --green-bg:    rgba(34,197,94,0.10);
    --green-border:rgba(34,197,94,0.25);
    --green-text:  #16a34a;
    --radius:      12px;
    --radius-sm:   6px;
    --font:        'Inter', system-ui, -apple-system, sans-serif;
    --mono:        ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  body {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Container ── */
  .kavach-embed {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 12px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Search bar ── */
  .search-form {
    position: relative;
    margin-bottom: 12px;
  }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-dim);
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 100px 13px 42px;
    font-size: 16px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .search-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-btn:hover { background: var(--accent-hover); }
  .search-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* ── Chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; align-items: center; }
  .chip-label { font-size: 11px; color: var(--text-dim); }
  .chip {
    font-size: 11px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); padding: 4px 10px; border-radius: 20px;
    cursor: pointer; transition: all 0.15s; font-family: var(--font);
  }
  .chip:hover { background: var(--surface-2); color: var(--text); border-color: #444; }

  /* ── Meta bar ── */
  .meta-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .meta-badge {
    font-size: 11px; font-family: var(--mono); color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px;
  }
  .meta-badge .accent { color: var(--accent); font-weight: 600; }
  .meta-badge.fallback {
    background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-text);
  }

  /* ── Skeleton ── */
  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
  .skeleton {
    background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
    background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 6px;
  }
  .skel-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  }
  .skel-card .row { display: flex; gap: 10px; align-items: flex-start; }
  .skel-circle { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .skel-body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel-line { height: 14px; }
  .skel-line.w1 { width: 50%; } .skel-line.w2 { width: 75%; } .skel-line.w3 { width: 100%; }
  .skel-tags { display: flex; gap: 6px; }
  .skel-tag { height: 18px; width: 55px; border-radius: 4px; }

  /* ── Injection banner ── */
  @keyframes pulse-shield { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .injection-banner {
    background: var(--red-bg); border: 1px solid var(--red-border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .injection-banner .shield { font-size: 26px; animation: pulse-shield 0.6s ease-out 3; }
  .injection-banner h3 { color: #fca5a5; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .injection-banner p { color: #f8717180; font-size: 12px; line-height: 1.6; }

  /* ── Result cards ── */
  @keyframes card-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .group-header {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin: 18px 0 8px; display: flex; align-items: center; gap: 6px;
  }
  .group-header .count { color: #444; }
  .result-card {
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
    transition: border-color 0.2s;
    animation: card-in 0.2s ease-out both;
  }
  .result-card:hover { border-color: #555; }
  .result-card.person    { background: var(--blue-bg);  border: 1px solid var(--blue-border); }
  .result-card.event     { background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .result-card.community { background: var(--green-bg); border: 1px solid var(--green-border); }

  .rank {
    width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-family: var(--mono); color: var(--text-dim); flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-title .emoji { font-size: 16px; }
  .card-title h3 { font-size: 14px; font-weight: 600; color: #fff; margin: 0; transition: color 0.2s; }
  .card-title a h3:hover { color: var(--accent); text-decoration: underline; }
  .type-badge {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    padding: 1px 7px; border-radius: 10px;
  }
  .type-badge.person    { background: var(--blue-bg);  color: var(--blue-text);  border: 1px solid var(--blue-border); }
  .type-badge.event     { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
  .type-badge.community { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green-border); }

  .card-location { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .card-desc { font-size: 13px; color: #c4c4d4; margin-top: 6px; line-height: 1.5; }
  .card-reason {
    font-size: 12px; color: #a5b4fc; font-style: italic; margin-top: 7px;
    border-left: 2px solid var(--accent); padding-left: 10px;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag {
    font-size: 10px; font-family: var(--mono); background: var(--surface);
    color: var(--text-muted); padding: 2px 7px; border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── No results ── */
  .no-results { text-align: center; color: var(--text-dim); padding: 32px 0; }
  .no-results p:first-child { font-size: 16px; }
  .no-results p:last-child { font-size: 12px; margin-top: 4px; }

  /* ── Footer badge ── */
  .powered-by {
    margin-top: auto;
    padding: 14px 0 4px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .powered-by a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .powered-by a:hover { text-decoration: underline; }

  /* ── Responsive ── */
  @media (max-width: 400px) {
    .kavach-embed { padding: 12px 10px 8px; }
    .search-input { font-size: 14px; padding: 11px 85px 11px 36px; }
    .search-btn { padding: 6px 12px; font-size: 12px; }
    .result-card { padding: 12px; }
  }
</style>
</head>
<body>

<div class="kavach-embed" id="app">
  <!-- Search -->
  <form class="search-form" id="searchForm">
    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Search people, events, communities…" />
    <button class="search-btn" id="searchBtn" type="submit">Search</button>
  </form>

  <div class="chips">
    <span class="chip-label">Try:</span>
    <button class="chip" data-q="Flutter developers in Lucknow">Flutter Lucknow</button>
    <button class="chip" data-q="AI/ML researchers Bangalore">AI/ML Bangalore</button>
    <button class="chip" data-q="Web3 communities Pune">Web3 Pune</button>
    <button class="chip" data-q="DevOps Kubernetes events">DevOps K8s</button>
  </div>

  <!-- Results container -->
  <div id="results"></div>

  <!-- Powered-by badge -->
  <div class="powered-by">
    🛡️ Powered by <a href="#">Kavach Search</a> · injection-hardened
  </div>
</div>

<script>
(function() {
  // ── Config ──
  const API_BASE = 'http://127.0.0.1:8000';

  const TYPE_META = {
    person:    { emoji: '👤', label: 'People' },
    event:     { emoji: '📅', label: 'Events' },
    community: { emoji: '👥', label: 'Communities' },
  };
  const TYPE_ORDER = ['person', 'event', 'community'];

  // ── DOM refs ──
  const form      = document.getElementById('searchForm');
  const input     = document.getElementById('searchInput');
  const btn       = document.getElementById('searchBtn');
  const container = document.getElementById('results');

  // ── Search handler ──
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    await doSearch(q);
  });

  // ── Example chips ──
  document.querySelectorAll('.chip').forEach(function(chip) {
    chip.addEventListener('click', async function() {
      const q = this.dataset.q;
      input.value = q;
      await doSearch(q);
    });
  });

  // ── Core search ──
  async function doSearch(query) {
    btn.disabled = true;
    btn.textContent = 'Searching…';
    showSkeletons();

    try {
      const t0 = performance.now();
      const resp = await fetch(API_BASE + '/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, k: 10 }),
      });

      if (!resp.ok) throw new Error('API error: ' + resp.status);
      const data = await resp.json();
      const ms = Math.round(performance.now() - t0);

      render(data, ms);
    } catch (err) {
      container.innerHTML = '<div class="no-results"><p>⚠️ ' + escHtml(err.message) + '</p></div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  // ── Render ──
  function render(data, ms) {
    let html = '';

    // Meta bar
    html += '<div class="meta-bar">';
    html += '<span class="meta-badge">' + ms + 'ms via <span class="accent">' + escHtml(data.tier_used) + '</span></span>';
    if (data.tier_used === 'ollama' || data.tier_used === 'rules') {
      html += '<span class="meta-badge fallback">⚡ Local fallback</span>';
    }
    html += '<span class="meta-badge">' + data.results.length + ' results · ' + Math.round(data.confidence * 100) + '% confidence</span>';
    html += '</div>';

    // Injection
    if (data.injection_detected) {
      html += '<div class="injection-banner">';
      html += '  <span class="shield">🛡️</span>';
      html += '  <div>';
      html += '    <h3>This query was flagged and blocked for safety</h3>';
      html += '    <p>Kavach Search detected a potential prompt injection. No results returned.</p>';
      html += '  </div>';
      html += '</div>';
      container.innerHTML = html;
      return;
    }

    if (data.results.length === 0) {
      html += '<div class="no-results"><p>No matching entities found.</p><p>Try broadening your search.</p></div>';
      container.innerHTML = html;
      return;
    }

    // Group by type
    var groups = {};
    TYPE_ORDER.forEach(function(t) { groups[t] = []; });
    data.results.forEach(function(r) { if (groups[r.type]) groups[r.type].push(r); });

    var rank = 0;
    TYPE_ORDER.forEach(function(type) {
      var items = groups[type];
      if (items.length === 0) return;
      var meta = TYPE_META[type];

      html += '<div class="group-header">' + meta.emoji + ' ' + meta.label + ' <span class="count">(' + items.length + ')</span></div>';

      items.forEach(function(item) {
        rank++;
        html += '<div class="result-card ' + type + '" style="animation-delay:' + (rank * 40) + 'ms">';
        html += '  <span class="rank">' + rank + '</span>';
        html += '  <div class="card-body">';
        html += '    <div class="card-title">';
        html += '      <span class="emoji">' + meta.emoji + '</span>';
        if (item.url) {
          html += '      <a href="' + escHtml(item.url) + '" target="_blank" style="text-decoration:none;"><h3>' + escHtml(item.name) + '</h3></a>';
        } else {
          html += '      <h3>' + escHtml(item.name) + '</h3>';
        }
        html += '      <span class="type-badge ' + type + '">' + type + '</span>';
        html += '    </div>';
        if (item.location) {
          html += '    <div class="card-location">📍 ' + escHtml(item.location) + '</div>';
        }
        if (item.description) {
          html += '    <div class="card-desc">' + escHtml(item.description) + '</div>';
        }
        if (item.reason) {
          html += '    <div class="card-reason">&ldquo;' + escHtml(item.reason) + '&rdquo;</div>';
        }
        if (item.tags && item.tags.length > 0) {
          html += '    <div class="card-tags">';
          item.tags.slice(0, 3).forEach(function(tag) {
            html += '<span class="tag">' + escHtml(tag) + '</span>';
          });
          if (item.tags.length > 3) html += '<span class="tag">+' + (item.tags.length - 3) + '</span>';
          html += '    </div>';
        }
        html += '  </div>';
        html += '</div>';
      });
    });

    container.innerHTML = html;
  }

  // ── Skeleton ──
  function showSkeletons() {
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<div class="skel-card"><div class="row">';
      html += '<div class="skel-circle skeleton"></div>';
      html += '<div class="skel-body">';
      html += '<div class="skel-line skeleton w1"></div>';
      html += '<div class="skel-line skeleton w2"></div>';
      html += '<div class="skel-line skeleton w3"></div>';
      html += '<div class="skel-tags"><div class="skel-tag skeleton"></div><div class="skel-tag skeleton"></div><div class="skel-tag skeleton"></div></div>';
      html += '</div></div></div>';
    }
    container.innerHTML = html;
  }

  // ── Util ──
  function escHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
